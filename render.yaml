databases:
  - name: habit-tracker-db
    databaseName: habit_tracker
    plan: free

services:
  - type: web
    name: habit-tracker-api
    plan: free
    runtime: node
    buildCommand: cd backend && npm ci && npx prisma generate
    startCommand: cd backend && node dist/src/main
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: habit-tracker-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: WHATSAPP_PROVIDER
        value: baileys
      - key: WHATSAPP_SESSION_ENCRYPTION_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
